<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full opacity-75">
  <defs>
    <!-- 同样加深了边缘清晰度的蒙版 -->
    <radialGradient id="cameraFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="65%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.15"/>
    </radialGradient>
    <mask id="maskCamera">
      <rect width="800" height="500" fill="url(#cameraFade)"/>
    </mask>
  </defs>

  <g mask="url(#maskCamera)">
    <!-- 背景工业网格 -->
    <g stroke="currentColor" stroke-width="0.5" stroke-opacity="0.15">
      <pattern id="gridCamera" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none"/>
      </pattern>
      <rect width="800" height="500" fill="url(#gridCamera)" />
      <!-- 光学中心基准线 (Optical Axis) -->
      <line x1="0" y1="250" x2="800" y2="250" stroke-opacity="0.4" stroke-dasharray="20 4 4 4" />
      <line x1="330" y1="0" x2="330" y2="500" stroke-opacity="0.2" stroke-dasharray="10 5" />
    </g>

    <!-- 相机整体 (Center around sensor plane X=330) -->
    <g stroke="currentColor">
      
      <!-- A. 机身 (Sony A7C Body) -->
      <g fill="currentColor" fill-opacity="0.03">
        <!-- 核心机身 -->
        <rect x="310" y="210" width="45" height="80" rx="3" stroke-width="1.2" stroke-opacity="0.9" />
        <!-- 背部 LCD 与取景器 -->
        <path d="M 310 215 L 304 215 L 304 225 L 310 230" stroke-width="0.8" stroke-opacity="0.7" />
        <rect x="307" y="235" width="3" height="50" stroke-width="0.8" stroke-opacity="0.6" />
        <!-- 顶部热靴 -->
        <rect x="325" y="205" width="16" height="5" stroke-width="0.8" stroke-opacity="0.8" />
        <!-- 前方手柄微凸 -->
        <path d="M 355 225 L 362 225 L 362 285 L 355 285" stroke-width="1" stroke-opacity="0.8" />
      </g>

      <!-- 机身内部定位标记 -->
      <g stroke-width="0.5" stroke-opacity="0.5">
        <!-- 传感器焦平面标记 (Sensor Plane: Φ) -->
        <circle cx="330" cy="218" r="3.5" fill="none" />
        <line x1="324" y1="218" x2="336" y2="218" />
        <line x1="330" y1="180" x2="330" y2="210" stroke-dasharray="2 2" stroke-opacity="0.4" />
        <!-- 卡口转接处 -->
        <rect x="362" y="225" width="6" height="50" stroke-width="0.9" stroke-opacity="0.8" />
      </g>

      <!-- B. 镜头主体 (Tamron 28-200 - 等半径直筒设计) -->
      <!-- 镜头外径固定高度为 64 (y=218 到 y=282) -->
      <g fill="currentColor" fill-opacity="0.02">
        <!-- 1. 卡口微缩颈 (Mount Taper) -->
        <polygon points="368,225 382,218 382,282 368,275" stroke-width="1" stroke-opacity="0.8" />
        
        <!-- 2. 变焦环 (Zoom Ring) - 半径相同 -->
        <rect x="382" y="218" width="55" height="64" stroke-width="1" stroke-opacity="0.9" />
        <!-- 变焦环防滑纹 -->
        <g stroke-width="0.5" stroke-opacity="0.3">
          <line x1="387" y1="218" x2="387" y2="282" stroke-dasharray="1 3" />
          <line x1="392" y1="218" x2="392" y2="282" stroke-dasharray="1 3" />
          <line x1="397" y1="218" x2="397" y2="282" stroke-dasharray="1 3" />
          <line x1="402" y1="218" x2="402" y2="282" stroke-dasharray="1 3" />
          <line x1="407" y1="218" x2="407" y2="282" stroke-dasharray="1 3" />
          <line x1="412" y1="218" x2="412" y2="282" stroke-dasharray="1 3" />
          <line x1="417" y1="218" x2="417" y2="282" stroke-dasharray="1 3" />
          <line x1="422" y1="218" x2="422" y2="282" stroke-dasharray="1 3" />
          <line x1="427" y1="218" x2="427" y2="282" stroke-dasharray="1 3" />
          <line x1="432" y1="218" x2="432" y2="282" stroke-dasharray="1 3" />
        </g>

        <!-- 3. 中间静止镜筒 (Mid Barrel) -->
        <rect x="437" y="218" width="15" height="64" stroke-width="0.8" stroke-opacity="0.7" />
        
        <!-- 4. 对焦环 (Focus Ring) -->
        <rect x="452" y="218" width="35" height="64" stroke-width="1" stroke-opacity="0.9" />
        <!-- 对焦环防滑长实线 -->
        <g stroke-width="0.5" stroke-opacity="0.3">
          <line x1="457" y1="218" x2="457" y2="282" />
          <line x1="462" y1="218" x2="462" y2="282" />
          <line x1="467" y1="218" x2="467" y2="282" />
          <line x1="472" y1="218" x2="472" y2="282" />
          <line x1="477" y1="218" x2="477" y2="282" />
          <line x1="482" y1="218" x2="482" y2="282" />
        </g>

        <!-- 5. 前镜筒 (Front Barrel) -->
        <rect x="487" y="218" width="25" height="64" stroke-width="0.8" stroke-opacity="0.7" />
        <!-- 滤镜安装环 -->
        <rect x="512" y="220" width="4" height="60" stroke-width="0.8" stroke-opacity="0.6" />
        <!-- 前组玻璃微凸 -->
        <path d="M 516 225 Q 523 250 516 275" stroke-width="1.2" stroke-opacity="0.5" />

        <!-- C. 莲花遮光罩侧面轮廓 (Petal Lens Hood Side Profile) -->
        <!-- 外层轮廓：前端张开，中间有花瓣切角 -->
        <polygon points="516,219 576,204 561,229 561,271 576,296 516,281" stroke-width="1" stroke-opacity="0.9" fill="currentColor" fill-opacity="0.04" stroke-linejoin="round" />
        <!-- 遮光罩内壁厚度线，增强立体工业感 -->
        <polygon points="518,222 572,208 558,231 558,269 572,292 518,278" stroke-width="0.5" stroke-opacity="0.4" fill="none" />
      </g>

      <!-- 视场角光学射线 (FOV lines expanding out of hood) -->
      <g stroke-width="0.6" stroke-opacity="0.3" stroke-dasharray="4 4">
        <line x1="520" y1="250" x2="680" y2="180" />
        <line x1="520" y1="250" x2="680" y2="320" />
        <!-- 弧线角度 -->
        <path d="M 640 197 Q 660 250 640 303" stroke-dasharray="2 2" stroke-opacity="0.5" />
      </g>

      <!-- 尺寸线与工程标注 -->
      <g stroke-width="0.8" stroke-opacity="0.5" font-family="monospace" font-size="8" tracking="1" opacity="0.8">
        <!-- 总长度标注 -->
        <line x1="330" y1="165" x2="576" y2="165" />
        <line x1="330" y1="160" x2="330" y2="170" />
        <line x1="576" y1="160" x2="576" y2="170" />
        <line x1="576" y1="170" x2="576" y2="200" stroke-dasharray="2 2" stroke-width="0.5" />
        <text x="453" y="157" text-anchor="middle">OPTICAL LENGTH: 246mm (W/ HOOD)</text>

        <!-- 器材参数 -->
        <text x="315" y="325">BODY: ILCE-7C</text>
        <text x="430" y="325">LENS: 28-200mm f/2.8-5.6</text>
        <text x="585" y="253" font-size="7">Ø67</text>
        
        <text x="550" y="115" text-anchor="middle">[ FIG 02: CAMERA SYSTEM ARCHITECTURE ]</text>
      </g>
    </g>

    <!-- 角落定位十字 -->
    <g stroke="currentColor" stroke-width="0.6" opacity="0.4">
      <circle cx="50" cy="50" r="5" fill="none" /><line x1="40" y1="50" x2="60" y2="50" /><line x1="50" y1="40" x2="50" y2="60" />
      <circle cx="750" cy="450" r="5" fill="none" /><line x1="740" y1="450" x2="760" y2="450" /><line x1="750" y1="440" x2="750" y2="460" />
    </g>
  </g>
</svg>
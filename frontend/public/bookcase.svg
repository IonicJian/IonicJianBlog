<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full opacity-75">
  <defs>
    <!-- 边缘淡出蒙版：让图形自然隐入深色背景 -->
    <radialGradient id="bookshelfFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="65%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="800" height="500" fill="url(#bookshelfFade)"/>
    </mask>
  </defs>

  <g mask="url(#fadeMask)">
    <!-- ================= 1. 背景工业网格与模数线 ================= -->
    <g stroke="currentColor" stroke-width="0.5" stroke-opacity="0.12">
      <!-- 垂直网格线 -->
      <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="2 4" />
      <line x1="200" y1="0" x2="200" y2="500" stroke-dasharray="2 4" />
      <line x1="300" y1="0" x2="300" y2="500" stroke-dasharray="2 4" />
      <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="2 4" />
      <line x1="500" y1="0" x2="500" y2="500" stroke-dasharray="2 4" />
      <line x1="600" y1="0" x2="600" y2="500" stroke-dasharray="2 4" />
      <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="2 4" />
      
      <!-- 水平网格线 -->
      <line x1="0" y1="100" x2="800" y2="100" stroke-dasharray="2 4" />
      <line x1="0" y1="200" x2="800" y2="200" stroke-dasharray="2 4" />
      <line x1="0" y1="360" x2="800" y2="360" /> <!-- 基准重线 -->
      <line x1="0" y1="400" x2="800" y2="400" stroke-dasharray="2 4" />
    </g>

    <!-- ================= 2. CAD 尺寸测量标注线 (Dimension Lines) ================= -->
    <g stroke="currentColor" stroke-width="0.8" stroke-opacity="0.35">
      <!-- 顶部总宽度标注杆 -->
      <line x1="130" y1="80" x2="670" y2="80" />
      <line x1="130" y1="73" x2="130" y2="87" />
      <line x1="670" y1="73" x2="670" y2="87" />
      <line x1="130" y1="95" x2="130" y2="115" stroke-dasharray="2 2" />
      <line x1="670" y1="95" x2="670" y2="115" stroke-dasharray="2 2" />
      
      <!-- 最高书本的高度测量线 -->
      <line x1="485" y1="110" x2="525" y2="110" stroke-dasharray="2 2" />
      <line x1="515" y1="110" x2="515" y2="360" />
      <line x1="510" y1="110" x2="520" y2="110" />
      <line x1="510" y1="360" x2="520" y2="360" />

      <!-- 倾斜角标注弧线 -->
      <path d="M 320 360 A 35 35 0 0 0 310 326" stroke-dasharray="2 2" />
    </g>

    <!-- ================= 3. 书架底座 (Shelf Structure) ================= -->
    <g stroke="currentColor">
      <!-- 主板 (Top Shelf Beam) -->
      <line x1="100" y1="360" x2="700" y2="360" stroke-width="1.5" stroke-opacity="0.8" />
      <line x1="100" y1="368" x2="700" y2="368" stroke-width="0.8" stroke-opacity="0.4" />
      
      <!-- 金属支架 (Brackets with Hatchings) -->
      <!-- 左支架 -->
      <path d="M 160 368 L 160 395 L 185 368 Z" stroke-width="0.8" stroke-opacity="0.5" fill="currentColor" fill-opacity="0.03" />
      <line x1="165" y1="373" x2="170" y2="368" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="165" y1="383" x2="180" y2="368" stroke-width="0.5" stroke-opacity="0.3" />
      <!-- 右支架 -->
      <path d="M 640 368 L 640 395 L 615 368 Z" stroke-width="0.8" stroke-opacity="0.5" fill="currentColor" fill-opacity="0.03" />
      <line x1="635" y1="373" x2="630" y2="368" stroke-width="0.5" stroke-opacity="0.3" />
      <line x1="635" y1="383" x2="620" y2="368" stroke-width="0.5" stroke-opacity="0.3" />
    </g>

    <!-- ================= 4. 各不相同的书本排布 (Books Row) ================= -->
    <g stroke="currentColor" fill="currentColor">
      
      <!-- BOOK 1: 简练技术手册 (直立, 宽脊) -->
      <g stroke-width="0.9" stroke-opacity="0.75" fill-opacity="0.02">
        <rect x="130" y="180" width="36" height="180" rx="1" />
        <!-- 书脊装订凸脊 (Ribs) -->
        <line x1="130" y1="200" x2="166" y2="200" stroke-width="1.5" stroke-opacity="0.5" />
        <line x1="130" y1="204" x2="166" y2="204" stroke-width="0.5" stroke-opacity="0.3" />
        <line x1="130" y1="340" x2="166" y2="340" stroke-width="1.5" stroke-opacity="0.5" />
        <line x1="130" y1="344" x2="166" y2="344" stroke-width="0.5" stroke-opacity="0.3" />
        <!-- 标签框 -->
        <rect x="137" y="220" width="22" height="45" stroke-width="0.6" stroke-dasharray="1 1" stroke-opacity="0.4" />
      </g>

      <!-- BOOK 2: 窄版口袋书 (薄书) -->
      <g stroke-width="0.8" stroke-opacity="0.6" fill-opacity="0.04">
        <rect x="169" y="220" width="18" height="140" rx="0.5" />
        <line x1="178" y1="230" x2="178" y2="350" stroke-dasharray="4 2" stroke-opacity="0.3" />
      </g>

      <!-- BOOK 3: 活页装订册 (Binder with Rings) -->
      <g stroke-width="0.9" stroke-opacity="0.8" fill-opacity="0.03">
        <rect x="190" y="150" width="48" height="210" rx="2" />
        <!-- 左侧装订孔/圆环 -->
        <circle cx="197" cy="180" r="2.5" stroke-width="0.8" />
        <circle cx="197" cy="255" r="2.5" stroke-width="0.8" />
        <circle cx="197" cy="330" r="2.5" stroke-width="0.8" />
        <!-- 中间纵向技术线条 -->
        <line x1="205" y1="160" x2="205" y2="350" stroke-width="0.5" stroke-opacity="0.3" />
        <rect x="212" y="190" width="18" height="80" stroke-width="0.5" stroke-opacity="0.4" />
      </g>

      <!-- BOOK 4: 倾斜靠放的图书 (Leaning Book, ~15deg) -->
      <g transform="translate(240, 360) rotate(15) translate(-240, -360)" stroke-width="0.9" stroke-opacity="0.85" fill-opacity="0.04">
        <rect x="240" y="170" width="32" height="190" rx="1" />
        <!-- 内部斜线纹理 (Hatching) -->
        <line x1="240" y1="185" x2="272" y2="185" stroke-opacity="0.5" />
        <line x1="240" y1="345" x2="272" y2="345" stroke-opacity="0.5" />
        <!-- 悬挂的书签 (Bookmark) -->
        <path d="M 252 360 L 252 375 L 257 370 L 262 375 L 262 360" stroke-width="0.6" stroke-opacity="0.6" />
      </g>

      <!-- BOOK 5 & 6: 卷一、卷二（系列丛书 Set of Volumes） -->
      <!-- Vol.1 -->
      <g stroke-width="0.8" stroke-opacity="0.7" fill-opacity="0.02">
        <rect x="345" y="190" width="28" height="170" rx="1" />
        <rect x="351" y="210" width="16" height="30" stroke-width="0.5" stroke-opacity="0.4" />
        <!-- 卷号标记 I -->
        <line x1="359" y1="220" x2="359" y2="230" stroke-width="1.2" stroke-opacity="0.8" />
      </g>
      <!-- Vol.2 -->
      <g stroke-width="0.8" stroke-opacity="0.7" fill-opacity="0.02">
        <rect x="375" y="190" width="28" height="170" rx="1" />
        <rect x="381" y="210" width="16" height="30" stroke-width="0.5" stroke-opacity="0.4" />
        <!-- 卷号标记 II -->
        <line x1="386" y1="220" x2="386" y2="230" stroke-width="1.2" stroke-opacity="0.8" />
        <line x1="392" y1="220" x2="392" y2="230" stroke-width="1.2" stroke-opacity="0.8" />
      </g>

      <!-- BOOK 7: 最显著的大型参考典籍 (Extra Tall Technical Manual) -->
      <g stroke-width="1" stroke-opacity="0.9" fill-opacity="0.05">
        <rect x="406" y="110" width="55" height="250" rx="2" />
        <!-- 网格与科技图标装饰 -->
        <rect x="414" y="130" width="39" height="210" stroke-width="0.5" stroke-dasharray="2 2" stroke-opacity="0.3" />
        <circle cx="433.5" cy="170" r="10" stroke-width="0.7" stroke-opacity="0.5" />
        <path d="M 433.5 163 L 433.5 177 M 426.5 170 L 440.5 170" stroke-width="0.5" stroke-opacity="0.5" />
        <!-- 密集横向线条 -->
        <line x1="414" y1="210" x2="453" y2="210" stroke-dasharray="1 2" stroke-opacity="0.4" />
        <line x1="414" y1="220" x2="453" y2="220" stroke-dasharray="1 2" stroke-opacity="0.4" />
        <line x1="414" y1="230" x2="453" y2="230" stroke-dasharray="1 2" stroke-opacity="0.4" />
      </g>

      <!-- BOOK 8: 极简现代书籍 -->
      <g stroke-width="0.8" stroke-opacity="0.6" fill-opacity="0.02">
        <rect x="464" y="200" width="22" height="160" rx="0.5" />
        <line x1="475" y1="210" x2="475" y2="350" stroke-width="0.5" stroke-opacity="0.3" />
      </g>

      <!-- BOOK 9: 依靠在右侧的书中等大 (Medium Book) -->
      <g stroke-width="0.8" stroke-opacity="0.75" fill-opacity="0.03">
        <rect x="489" y="160" width="38" height="200" rx="1" />
        <line x1="489" y1="180" x2="527" y2="180" stroke-opacity="0.4" />
        <line x1="489" y1="340" x2="527" y2="340" stroke-opacity="0.4" />
        <!-- 几何方块纹理 -->
        <rect x="502" y="230" width="12" height="12" stroke-width="0.6" stroke-opacity="0.5" />
      </g>

      <!-- BOOKEND: 右侧工业挡书立 (Metal Bookend) -->
      <g stroke-width="1" stroke-opacity="0.6">
        <path d="M 527 360 L 560 360 L 560 355 L 535 320 L 527 320 Z" fill="currentColor" fill-opacity="0.04" />
      </g>
    </g>

    <!-- ================= 5. CAD 标注文字与标号 (Technical Annotations) ================= -->
    <g fill="currentColor" opacity="0.4" font-family="monospace" font-size="9" tracking="1">
      <!-- 顶部尺寸文本 -->
      <text x="360" y="75" text-anchor="middle">[ 540mm ARCHIVE ELEVATION ]</text>
      <!-- 高度尺寸文本 -->
      <text x="535" y="235" text-anchor="start">H:250mm</text>
      <!-- 角度文本 -->
      <text x="295" y="340" text-anchor="end">15.4°</text>

      <!-- 对齐十字靶心标识 (Crosshairs) -->
      <g stroke="currentColor" stroke-width="0.6" opacity="0.6">
        <!-- 左侧靶心 -->
        <circle cx="100" cy="100" r="4" fill="none" />
        <line x1="92" y1="100" x2="108" y2="100" />
        <line x1="100" y1="92" x2="100" y2="108" />
        
        <!-- 右侧靶心 -->
        <circle cx="700" cy="360" r="4" fill="none" />
        <line x1="692" y1="360" x2="708" y2="360" />
        <line x1="700" y1="352" x2="700" y2="368" />
      </g>

      <text x="110" y="103">FIG 01.0</text>
      <text x="670" y="380">REF: BASE-01</text>
    </g>
  </g>
</svg>
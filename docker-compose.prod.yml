services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 不暴露端口到宿主机，仅内部网络可访问

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: blog-backend
    environment:
      SERVER_PORT: ":8080"
      SERVER_MODE: "release"
      SERVER_FRONTEND_URL: ${SERVER_FRONTEND_URL:-http://localhost}
      DATABASE_DSN: "postgres://blog_user:${POSTGRES_PASSWORD}@postgres:5432/blog?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      ADMIN_GITHUB_ID: ${ADMIN_GITHUB_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@blog.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    # 后端不暴露端口到宿主机，仅前端 nginx 通过内部网络访问

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: blog-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  backend-lint:
    name: Backend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...

  frontend-lint:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [backend-lint, frontend-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Go binary (linux/amd64)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o ../deploy/backend/blog-server ./cmd/server

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Assemble deploy package
        run: |
          cp -r frontend/dist deploy/frontend/
          cp frontend/nginx.conf deploy/frontend/
          # tar for faster scp (keep in workspace — scp-action runs in container)
          tar -czf deploy.tar.gz deploy/

      - name: Copy to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634  # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp/

      - name: Rebuild and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/deploy
            rm -rf backend frontend docker-compose.yml
            tar -xzf /tmp/deploy.tar.gz --strip-components=1 -C .
            docker compose down 2>/dev/null || true
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f
            sleep 3
            curl -sf http://localhost/api/v1/health && echo "Deploy OK"
